databases:
  - name: uist2its-db
    databaseName: uist2its
    user: uist2its
    plan: basic-256mb
    region: frankfurt

services:
  - type: web
    name: uist2its
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    healthCheckPath: /up
    disk:
      name: uist2its-public-storage
      mountPath: /var/www/html/storage/app/public
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: UIST2its
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_TIMEZONE
        value: Africa/Abidjan
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: uist2its-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_SCHEME
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: UIST2its
      - key: UIST_ADMISSION_AVERAGE
        value: "10"
      - key: UIST_STUDENT_LOGIN_ATTEMPTS
        value: "5"
      - key: UIST_STUDENT_LOGIN_DECAY_MINUTES
        value: "1"
